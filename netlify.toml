# Configuración Netlify — Grupo LGO
# El sitio se queda ESTÁTICO (Astro SSG): NO hay adapter SSR.
# Solo las funciones de /contratos corren como endpoints serverless.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Las plantillas .docx (que rellena netlify/functions/generar.js) NO son código:
  # esbuild no las detecta como import, así que se declaran aquí para que el
  # bundler las incluya en el paquete de la función. Carpeta committeada, NO pública.
  included_files = ["netlify/plantillas/**"]

# Para `netlify dev`: Astro corre en :4321 y Netlify lo proxea + sirve las
# funciones en /.netlify/functions/<nombre>.
[dev]
  targetPort = 4321

# ── Headers de seguridad (todo el sitio) ──
# No afectan el render ni el flujo del asistente: solo endurecen la respuesta.
# Señal de confianza relevante para contenido legal (YMYL). El HSTS lo emite
# Netlify automáticamente (max-age 1 año); no lo sobrescribimos aquí.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ── Consolidación de duplicado (SEO, Fase E) ──
# donacion-bien-inmueble-2 es un duplicado accidental de donacion-bien-inmueble
# (mismo nombre, misma explicación, mismo precio). 301 permanente para consolidar
# las señales en la canónica. force=true es necesario: la página estática existe
# (getStaticPaths la genera) y, sin force, el archivo le ganaría al redirect.
# El backend (chat/generación) sigue usando el id; el 301 solo afecta la URL pública.
[[redirects]]
  from = "/contratos/donacion-bien-inmueble-2/"
  to = "/contratos/donacion-bien-inmueble/"
  status = 301
  force = true

# ── Reubicación del Diagnóstico (SEO) ──
# El Diagnóstico de Salud Empresarial se movió de /cursos/diagnostico-salud-empresarial/
# a su propia landing de nivel superior /diagnostico/. La URL vieja ya estaba indexada,
# así que un 301 permanente traspasa las señales a la nueva. NO lleva force=true: la
# página vieja ya no se genera (se eliminó del build), así que no hay archivo estático
# que le gane al redirect.
#
# Se declaran AMBAS formas explícitamente (con y sin diagonal final): la
# normalización de trailing-slash de Netlify en el `from` de una regla no está
# garantizada, así que no dependemos de ella. Las dos apuntan a la canónica /diagnostico/.
[[redirects]]
  from = "/cursos/diagnostico-salud-empresarial/"
  to = "/diagnostico/"
  status = 301

[[redirects]]
  from = "/cursos/diagnostico-salud-empresarial"
  to = "/diagnostico/"
  status = 301

# ── Alias de la división de administración inmobiliaria ──
# La URL canónica de la sección es /administracion-de-condominios/.
# /administradores/ queda como alias permanente: el nombre corto es el que la
# gente escribe a mano y el que puede aparecer en referencias externas.
#
# force=true es necesario, por la misma razón que en el 301 de donacion-bien-inmueble-2:
# el `redirects` de astro.config.mjs genera dist/administradores/index.html (una página
# de redirección con meta refresh, canonical y noindex) y, sin force, ese archivo
# estático le ganaría a esta regla. Con force, Netlify responde 301 en el servidor y la
# página de Astro queda solo como respaldo si el sitio se sirve fuera de Netlify.
#
# Se declaran ambas formas (con y sin diagonal final), igual que en el 301 del
# Diagnóstico: la normalización de trailing-slash en el `from` no está garantizada.
[[redirects]]
  from = "/administradores/"
  to = "/administracion-de-condominios/"
  status = 301
  force = true

[[redirects]]
  from = "/administradores"
  to = "/administracion-de-condominios/"
  status = 301
  force = true
